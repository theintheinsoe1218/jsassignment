<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>BMI Calculator</title>

<style>

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial;
  background:linear-gradient(135deg,#6c5ce7,#00cec9);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  background:white;
  width:350px;
  padding:30px;
  border-radius:15px;
  box-shadow:0 10px 20px rgba(0,0,0,0.2);
}

h1{
  text-align:center;
  margin-bottom:20px;
}

.input-group{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:5px;
}

input{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  background:#00b894;
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  background:#019875;
}

.result{
  margin-top:20px;
  text-align:center;
}

.result h2{
  margin-bottom:10px;
}

</style>
</head>

<body>

<div class="container">

  <h1>BMI Calculator</h1>

  <!-- Weight -->
  <div class="input-group">
    <label>Weight (lb)</label>
    <input type="number" id="weight" placeholder="Enter weight">
  </div>

  <!-- Feet -->
  <div class="input-group">
    <label>Height (feet)</label>
    <input type="number" id="feet" placeholder="Feet">
  </div>

  <!-- Inches -->
  <div class="input-group">
    <label>Height (inches)</label>
    <input type="number" id="inches" placeholder="Inches">
  </div>

  <button onclick="calculateBMI()">
    Calculate BMI
  </button>

  <!-- Result -->
  <div class="result">
    <h2 id="bmiResult">BMI: -</h2>
    <p id="status">Status: -</p>
  </div>

</div>

<script src="bmi.js"></script>

</body>
</html>
