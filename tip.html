<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tip Calculator</title>

<style>

body{
  font-family:Arial;
  background:linear-gradient(135deg,#ff7a18,#af002d);
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
}

.container{
  background:white;
  padding:25px;
  width:350px;
  border-radius:15px;
  box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

h2{
  text-align:center;
  margin-bottom:20px;
}

.input-group{
  margin-bottom:15px;
}

label{
  display:block;
  margin-bottom:5px;
}

input{
  width:100%;
  padding:10px;
  border:1px solid #ccc;
  border-radius:8px;
}

button{
  width:100%;
  padding:12px;
  border:none;
  background:#ff7a18;
  color:white;
  border-radius:8px;
  cursor:pointer;
  font-size:16px;
}

button:hover{
  background:#e6680f;
}

.result{
  margin-top:20px;
  background:#f4f4f4;
  padding:15px;
  border-radius:10px;
}

.result p{
  margin:5px 0;
}

</style>
</head>

<body>

<div class="container">

  <h2>Tip Calculator</h2>

  <!-- Bill -->
  <div class="input-group">
    <label>Bill Amount ($)</label>
    <input type="number" id="bill" placeholder="Enter bill amount">
  </div>

  <!-- Tip -->
  <div class="input-group">
    <label>Tip (%)</label>
    <input type="number" id="tip" placeholder="Enter tip %">
  </div>

  <!-- People -->
  <div class="input-group">
    <label>People</label>
    <input type="number" id="people" placeholder="How many people?">
  </div>

  <button onclick="calculateTip()">Calculate</button>

  <!-- Result -->
  <div class="result">
    <p id="tipAmount">Tip: -</p>
    <p id="totalAmount">Total: -</p>
    <p id="perPerson">Per Person: -</p>
  </div>

</div>

<script src="tip.js"></script>

</body>
</html>
